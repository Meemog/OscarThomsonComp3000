services:
  proxy:
    image: nginx:latest
    container_name: proxy
    ports:
      - 80:80
    working_dir: /etc/nginx/conf.d/
    volumes:
      - ./proxy/proxyconf:/etc/nginx/conf.d/
      - ./proxy/nginxconf/nginx.conf:/etc/nginx/nginx.conf
    tty: true

  employee-fe:
    image: node:alpine
    container_name: employee-fe
    ports:
      - 81:8000
    command: "./setup.sh"
    working_dir: /srv/app
    volumes:
      - ./employee-fe:/srv/app
      - /srv/app/node_modules
    tty: true

  employer-fe:
    image: node:alpine
    container_name: employer-fe
    ports:
      - 82:8001
    command: "./setup.sh"
    working_dir: /srv/app
    volumes:
      - ./employer-fe:/srv/app
      - /srv/app/node_modules
    tty: true

  clock-fe:
    image: node:alpine
    container_name: clock-fe
    ports:
      - 83:8002
    command: "./setup.sh"
    working_dir: /srv/app
    volumes:
      - ./clock-fe:/srv/app
      - /srv/app/node_modules
    tty: true
  
  backend:
    image: node:alpine
    container_name: backend
    command: "./setup.sh"
    working_dir: /srv/app
    volumes:
      - ./backend:/srv/app
    tty: true
  
  database:
    image: mongo:6-jammy
    container_name: database
    ports:
      - 27017:27017
    volumes:
      - dbdata6:/data/db
  
  images:
    image: node:alpine
    container_name: images
    command: "./setup.sh"
    working_dir: /srv/app
    volumes:
      - ./images:/srv/app/
      - /srv/app/node_modules
    
volumes:
  dbdata6: